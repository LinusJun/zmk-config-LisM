# Unified set: one dongle + four peripherals + settings reset, no battery variants.
include:
  - board: xiao_ble//zmk
    shield: lism_dongle prospector_adapter xiao_plus_147_touch
    artifact-name: lism_dongle_xiao147
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y -DCONFIG_LISM_XIAO147_AUTO_TOUCH=y -DCONFIG_I2C_NRFX_TRANSFER_TIMEOUT=100 -DCONFIG_LISM_XIAO147_DISPLAY_SELFTEST=n -DCONFIG_LISM_XIAO147_RAW_CAPTURE=n -DCONFIG_LISM_XIAO147_GESTURE_SHADOW=n -DCONFIG_LISM_XIAO147_RAW_GESTURE_HID_TEST=n -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=0
    snippet: zmk-usb-logging
  - board: xiao_ble//zmk
    shield: lism_left rgbled_adapter
    artifact-name: lism_left_4waystick
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: xiao_ble//zmk
    shield: lism_right rgbled_adapter
    artifact-name: lism_right_trackball
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: xiao_ble//zmk
    shield: lism_joystick
    artifact-name: lism_jp19
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: xiao_ble//zmk
    shield: lism_circlepad
    artifact-name: lism_circlepad
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: settings_reset-xiao_ble-zmk
