name: Build LisM ESB v502 XIAO147 two-page UI TEST
on:
  workflow_dispatch:
  push:
    branches: [ codex/esb-v50-dual-dongle ]
    paths: [ 'boards/**', 'config/**', 'src/**', 'cmake/**', 'tools/**', 'tests/**', 'CMakeLists.txt', 'Kconfig', '.github/workflows/build.yml' ]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:4.1-branch
    strategy:
      fail-fast: false
      matrix:
        target: [ left, right, dongle_a, dongle_b, reset ]
    steps:
      - uses: actions/checkout@v4
        with:
          path: config
      - name: Fetch pinned firmware dependencies
        run: |
          west init -l --mf config/west.yml config
          west update --narrow --fetch-opt=--depth=1
          west zephyr-export
      - name: Build isolated upstream ESB integration
        run: python3 config/tools/build_upstream_esb.py --workspace "$PWD" --target "${{ matrix.target }}"
      - name: Verify preserved keymap
        if: matrix.target == 'dongle_a'
        run: python3 config/tests/fourwaystick_regression_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: LisM-ESBv502-${{ matrix.target }}
          path: config/artifacts/*
