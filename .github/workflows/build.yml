name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    branches: [ main, codex/xiao-plus-147-touch-dongle, codex/xiao147-display-menu-imu, codex/xiao147-all-peripherals ]
    paths:
      - '.github/workflows/build.yml'
      - 'boards/**'
      - 'config/**'
      - 'snippets/**'
      - 'build.yaml'
      - 'src/**'
      - 'dts/**'
      - 'CMakeLists.txt'
      - 'Kconfig'
      - 'zephyr/module.yml'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'boards/**'
      - 'config/**'
      - 'snippets/**'
      - 'build.yaml'
      - 'src/**'
      - 'dts/**'
      - 'CMakeLists.txt'
      - 'Kconfig'
      - 'zephyr/module.yml'

jobs:
  build:
    # Keep this revision aligned with config/west.yml.
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@9ebbeff0a8b69a42f14aec022cdf16c7a107b9e0
