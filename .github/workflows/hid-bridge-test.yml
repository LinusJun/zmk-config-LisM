name: Experimental BLE HID mouse bridge
on:
  workflow_dispatch:
  push:
    branches: [codex/cheerdots2-hid-bridge]
jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      LISM_ZMK_APP: pinned-zmk/app
      LISM_ZEPHYR_BASE: pinned-zephyr
      LISM_PROSPECTOR_MODULE: pinned-prospector
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: zmkfirmware/zmk
          ref: 9ebbeff0a8b69a42f14aec022cdf16c7a107b9e0
          path: pinned-zmk
      - uses: actions/checkout@v7
        with:
          repository: zmkfirmware/zephyr
          ref: 10ba6d0cb38bc3d258775d27982f707599320085
          path: pinned-zephyr
      - uses: actions/checkout@v7
        with:
          repository: carrefinho/prospector-zmk-module
          ref: ed98221f3b52b7066dbb10ba3af8a29150b93a5a
          path: pinned-prospector
      - name: Bounded descriptor and source ownership tests
        run: |
          python3 tests/lism_hid_parser_host_test.py
          python3 tests/lism_hid_host_input_test.py
          python3 tests/cheerdots_hid_probe_test.py
          python3 tests/lism_hid_central_patch_test.py pinned-zmk/app
      - name: Existing firmware regressions
        run: |
          for test in tests/*_test.py; do
            case "$test" in
              *lism_hid_central_patch_test.py|*lism_hid_parser_host_test.py|*lism_hid_host_input_test.py|*cheerdots_hid_probe_test.py) continue ;;
            esac
            python3 "$test"
          done
  build:
    needs: regression
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@9ebbeff0a8b69a42f14aec022cdf16c7a107b9e0
    with:
      build_matrix_path: build-hid-bridge.yaml
      archive_name: experimental-hid-mouse-bridge
