# Intentionally only the screen dongle. No reset/peripheral/ADC diagnostic UF2.
include:
  - board: xiao_ble//zmk
    shield: lism_dongle prospector_adapter xiao_plus_147_touch
    artifact-name: lism_dongle_xiao147_release_candidate
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y -DCONFIG_LISM_XIAO147_DISPLAY_SELFTEST=n -DCONFIG_LISM_XIAO147_RAW_CAPTURE=n -DCONFIG_LISM_XIAO147_GESTURE_SHADOW=n -DCONFIG_LISM_XIAO147_RAW_GESTURE_HID_TEST=n -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=0
    snippet: zmk-usb-logging
  - board: xiao_ble//zmk
    shield: lism_dongle prospector_adapter xiao_plus_147_touch
    artifact-name: lism_dongle_xiao147_stability_shadow_test
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y -DCONFIG_LISM_XIAO147_DISPLAY_SELFTEST=n -DCONFIG_LISM_XIAO147_RAW_CAPTURE=y -DCONFIG_LISM_XIAO147_GESTURE_SHADOW=y -DCONFIG_I2C_NRFX_TRANSFER_TIMEOUT=100 -DCONFIG_LOG_BUFFER_SIZE=16384 -DCONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096 -DCONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10 -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=0 -DCONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1536 -DCONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y -DCONFIG_LOG_PROCESS_THREAD_PRIORITY=4
    snippet: zmk-usb-logging
  - board: xiao_ble//zmk
    shield: lism_dongle prospector_adapter xiao_plus_147_touch
    artifact-name: lism_dongle_xiao147_stability_test
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y -DCONFIG_LISM_XIAO147_DISPLAY_SELFTEST=n -DCONFIG_LISM_XIAO147_RAW_CAPTURE=y -DCONFIG_LISM_XIAO147_GESTURE_SHADOW=y -DCONFIG_LISM_XIAO147_RAW_GESTURE_HID_TEST=y -DCONFIG_I2C_NRFX_TRANSFER_TIMEOUT=100 -DCONFIG_LOG_BUFFER_SIZE=16384 -DCONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096 -DCONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10 -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=0 -DCONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1536 -DCONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y -DCONFIG_LOG_PROCESS_THREAD_PRIORITY=4
    snippet: zmk-usb-logging
