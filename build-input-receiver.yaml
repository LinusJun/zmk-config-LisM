# Standard BLE keyboard/mouse receiver plus two registered identical LisM sets.
# Never clears settings or bonds. Reset UF2 is packaged separately for recovery.
include:
  - board: xiao_ble//zmk
    shield: lism_dongle prospector_adapter xiao_plus_147_touch
    artifact-name: lism_dongle_xiao147_input_receiver
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y -DCONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=6 -DCONFIG_BT_MAX_PAIRED=14 -DCONFIG_LISM_BLE_HID_BRIDGE=y -DCONFIG_LISM_BLE_INPUT_BRIDGE=y -DCONFIG_LISM_BLE_HOST_PROFILES=6 -DCONFIG_LISM_TWO_KEYBOARD_SETS=y -DCONFIG_INPUT_THREAD_STACK_SIZE=2048 -DCONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096 -DCONFIG_LISM_XIAO147_AUTO_TOUCH=y -DCONFIG_I2C_NRFX_TRANSFER_TIMEOUT=100 -DCONFIG_LISM_XIAO147_DISPLAY_SELFTEST=n -DCONFIG_LISM_XIAO147_RAW_CAPTURE=n -DCONFIG_LISM_XIAO147_GESTURE_SHADOW=n -DCONFIG_LISM_XIAO147_RAW_GESTURE_HID_TEST=n -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=0
    snippet: zmk-usb-logging
