# Experimental generic BLE HOGP mouse bridge. Stable build remains unchanged.
include:
  - board: xiao_ble//zmk
    shield: lism_dongle prospector_adapter xiao_plus_147_touch
    artifact-name: lism_dongle_xiao147_hid_bridge_TEST
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y -DCONFIG_BT_MAX_PAIRED=10 -DCONFIG_LISM_BLE_HID_BRIDGE=y -DCONFIG_LISM_XIAO147_AUTO_TOUCH=y -DCONFIG_I2C_NRFX_TRANSFER_TIMEOUT=100 -DCONFIG_LISM_XIAO147_DISPLAY_SELFTEST=n -DCONFIG_LISM_XIAO147_RAW_CAPTURE=n -DCONFIG_LISM_XIAO147_GESTURE_SHADOW=n -DCONFIG_LISM_XIAO147_RAW_GESTURE_HID_TEST=n -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=0
    snippet: zmk-usb-logging
