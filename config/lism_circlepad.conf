# Four-wire Circle Pad peripheral for the existing three-device dongle.
CONFIG_ZMK_SLEEP=n
CONFIG_ADC=y
CONFIG_LISM_RESISTIVE_JOYSTICK=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y

# GPIO-owned status LEDs and conservative standard-XIAO charge current.
CONFIG_LISM_JOYSTICK_STATUS=y
CONFIG_CHARGE_INDICATOR=n
CONFIG_RGBLED_WIDGET=n
CONFIG_ZMK_IDLE_TIMEOUT=300000
