# Only the new Seeed 1.47-inch dongle build uses these options.
CONFIG_LISM_XIAO147_TOUCH=y
CONFIG_I2C=y
CONFIG_INPUT_GPIO_KEYS=y
# D15/USR2 is nRF52840 P0.10, multiplexed with NFC.
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_LV_FONT_MONTSERRAT_14=y
# Third split BLE slot is reserved for the separate joystick peripheral.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=3
