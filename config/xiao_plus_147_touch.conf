# Only the new Seeed 1.47-inch dongle build uses these options.
CONFIG_LISM_XIAO147_TOUCH=y
CONFIG_I2C=y
# Bound a failed peripheral transfer so the shared work queue can recover.
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=100
CONFIG_LISM_CHARGE_TELEMETRY=y
CONFIG_INPUT_GPIO_KEYS=y
# D15/USR2 uses P0.10; lism.dtsi enables GPIO via the Zephyr 4.1 UICR node.
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_10=y
CONFIG_LV_USE_SLIDER=y
CONFIG_LV_USE_SWITCH=y
# The custom portrait flush writes synchronously; Zephyr's optional flush
# thread must not retain its old semaphore wait callback.
CONFIG_LV_Z_FLUSH_THREAD=n
# Small partial buffers leave headroom for the complete menus/transform layers.
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_Z_DOUBLE_VDB=n
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_LV_Z_MEM_POOL_SYS_HEAP=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
# The XIAO-only panel driver performs the sole native->wire endian conversion.
CONFIG_LV_COLOR_16_SWAP=n
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_LEVEL_WARN=y
CONFIG_DISPLAY_LOG_LEVEL_INF=y
# Keep diagnostic-module INFO and all warnings, suppress ZMK's default DBG
# flood so a frozen display does not hide its heartbeat behind dropped logs.
CONFIG_ZMK_LOGGING_MINIMAL=y
# Left, right, JP19 and Circle Pad can all retain their BLE pairing.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=4
