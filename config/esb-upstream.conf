# Both halves are pure ESB; only the receiver retains host BLE.
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_COUNT=2
CONFIG_ZMK_SPLIT_ESB_AUTO_HEAL_KEY_POS_MAX=46
CONFIG_ZMK_SPLIT_ESB_RF_CH_HOP=n
CONFIG_ZMK_SPLIT_ESB_MSG_POSTFIX_CRC=y
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_ACK=y
CONFIG_ZMK_SPLIT_ESB_EVENT_BUFFER_ITEMS=64
CONFIG_ZMK_SPLIT_ESB_CMD_BUFFER_ITEMS=16
CONFIG_ESB_MAX_PAYLOAD_LENGTH=64
CONFIG_ESB_TX_FIFO_SIZE=1
CONFIG_ESB_RX_FIFO_SIZE=16
CONFIG_ESB_LOG_LEVEL_OFF=y
CONFIG_ESB_RADIO_IRQ_PRIORITY=0
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_INPUT_QUEUE_MAX_MSGS=128
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ZMK_SPLIT_ESB_LOG_LEVEL_INF=y
