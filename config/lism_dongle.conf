CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=3

CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_HID_INDICATORS=y

CONFIG_ZMK_SLEEP=n

# Nordic nRF52840 BLE TX power: +8 dBm (upstream 4mplelab main)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Prospector screen: rightmost OPERATOR layout from the status-screen preview.
CONFIG_PROSPECTOR_SHOW_MODIFIERS=y
CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y
CONFIG_PROSPECTOR_MODIFIER_OS_GENERIC=y
CONFIG_PROSPECTOR_MODIFIER_ORDER="GACS"
CONFIG_LISM_PROSPECTOR_LOCK_INDICATORS=y

# Match the previous dongle's fixed-brightness behavior.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=90
