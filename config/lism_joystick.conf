# Standalone validation peripheral: keep polling so analog movement is always detected.
CONFIG_ZMK_SLEEP=n

CONFIG_ADC=y
CONFIG_LISM_RESISTIVE_JOYSTICK=y

# Match the LisM halves and dongle radio power.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Battery telemetry to the dongle.
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
