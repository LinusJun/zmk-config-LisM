# Isolated XIAO USB tests; no dongle or keyboard half is built on this branch.
---
include:
  - board: xiao_ble//zmk
    shield: joystick_usb_test
    artifact-name: joystick_usb_wasd
    cmake-args: -DCONFIG_ZMK_BLE=n -DCONFIG_ZMK_SPLIT=n

  - board: xiao_ble//zmk
    shield: joystick_usb_test
    artifact-name: joystick_usb_adc_diagnostic
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_BLE=n -DCONFIG_ZMK_SPLIT=n -DCONFIG_LISM_JOYSTICK_DIAG_ONLY=y -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
